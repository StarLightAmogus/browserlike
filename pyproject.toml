[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "browserlike"
version = "0.1.0.dev0"
description = "Drop-in replacement for requests that looks like one real browser on every layer: TLS, HTTP/2, headers and client hints."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "browserlike contributors" }]
keywords = ["requests", "http", "http2", "tls", "ja4", "fingerprint", "impersonate", "browser", "scraping"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.31",
  "urllib3>=2.0",
  "publicsuffixlist>=1.0",
  # Default engine. httpcloak ships wheels only, no sdist: the marker lists the platforms that have
  # them, so elsewhere browserlike still installs and runs on the curl or wreq extra.
  "httpcloak>=1.7.3,<1.8; sys_platform == 'darwin' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]

[project.urls]
Homepage = "https://github.com/StarLightAmogus/browserlike"
Repository = "https://github.com/StarLightAmogus/browserlike"
Issues = "https://github.com/StarLightAmogus/browserlike/issues"
Changelog = "https://github.com/StarLightAmogus/browserlike/blob/main/CHANGELOG.md"
Telegram = "https://t.me/RickSoftware"

[project.optional-dependencies]
curl = ["curl_cffi>=0.17,<0.18"]
wreq = ["wreq>=0.13,<0.14; python_version >= '3.11'"]  # wreq 0.13 needs Python 3.11+
all = ["browserlike[curl,wreq]"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-requests",
  "h2>=4.1",
  "trustme>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/browserlike"]

[tool.hatch.build.targets.sdist]
include = ["src/browserlike", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "A", "C4", "PT", "PIE", "RET", "PL"]
ignore = [
  "PLR0913",  # constructors mirror requests' keyword-rich API
  "PLR2004",  # status codes and similar literals read better inline
  "PLR0911",
  "PLR0912",
  "PLC0415",  # engines are imported lazily on purpose: any of them may be missing
  "RUF022",   # __all__ is grouped by meaning, not sorted
  "N818",     # ChallengeDetected / EngineUnavailable read better without an Error suffix
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PLC0415"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/browserlike"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["httpcloak", "httpcloak.*", "curl_cffi", "curl_cffi.*", "wreq", "wreq.*", "publicsuffixlist"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: talks to tls.peet.ws; skipped unless --run-network is given",
  "engine: drives a real engine against the local echo server",
]

[tool.coverage.run]
source = ["browserlike"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
