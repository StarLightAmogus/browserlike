name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please leave out cookies, tokens, passwords and your IP address.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The shortest code that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Traceback or output
      render: text
  - type: input
    id: version
    attributes:
      label: browserlike version or commit
      placeholder: "0.1.0 or a commit hash"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - httpcloak (default)
        - curl_cffi
        - wreq
        - not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12, Ubuntu 24.04 x86_64"
    validations:
      required: true
